name: CI

# Gate for every push and PR: lint, typecheck, the deterministic routing /
# category-selection suites (pure: no DB, no network, no LLM) and a full
# `next build` on the same Node and lockfile as production. See docs/ai-routing/.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, routing tests, build
    runs-on: ubuntu-latest

    # `next build` prerenders cacheComponents routes that query Prisma. An empty
    # throwaway Postgres with the current schema lets them render (empty lists)
    # without touching real data or needing secrets in CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-only-not-a-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Category selection rules (precision + recall)
        run: pnpm test:category-rules

      - name: Eligibility ↔ inbox contract (categoriesMatch vs expandToMatchSet)
        run: pnpm test:eligibility-contract

      - name: Taxonomy depth tripwire (guards categoriesMatch's ≤3-level assumption)
        run: pnpm test:taxonomy-depth

      - name: Routing identity (multi-routing v4 id carry-through)
        run: pnpm routing:identity

      - name: Shadow routing smoke
        run: pnpm shadow:smoke

      - name: Create schema in the CI database
        run: pnpm exec prisma db push --skip-generate

      - name: Build
        run: pnpm build
