name: CI

# Deterministic gate for the routing / category-selection logic. These suites are
# pure (no DB, no network, no LLM), so they can run on every push and PR and must
# stay green before any routing change lands. See docs/ai-routing/.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & deterministic routing tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Catch type errors and Prisma drift before they hit production. `next
      # build` would be stricter, but it needs a live DB to prerender the
      # cacheComponents routes that read from Prisma; tsc on the whole tree
      # catches the same class of regression (missing fields, renamed APIs,
      # broken imports) without provisioning Postgres in CI.
      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Category selection rules (precision + recall)
        run: pnpm test:category-rules

      - name: Routing identity (multi-routing v4 id carry-through)
        run: pnpm routing:identity

      - name: Shadow routing smoke
        run: pnpm shadow:smoke
